version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: polar_ems_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polar_ems
    ports:
      - "5432:5432"
    volumes:
      - polar_ems_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polar_ems"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  polar_ems_pgdata:
    driver: local
